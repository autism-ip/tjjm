# 快速实验配置 - 12小时内完成
# 核心策略: 减少数据量 + 增大batch + 早停 + 缓存

data:
  dataset_dir: "./data/raw/LUNA16"
  luna16_raw_dir: "./data/raw/LUNA16"
  hu_min: -1000
  hu_max: 400
  target_spacing: [1.0, 1.0, 1.0]
  patch_size: [64, 64, 64]
  patch_stride: 64          # 增大stride减少patch数
  batch_size: 16            # 增大batch size
  num_workers: 8            # 增加workers
  max_ct_files: 100         # 只使用100个CT
  cache_preprocessed: true  # 缓存预处理结果

model:
  encoder_name: "swin_unetr"
  encoder_pretrained: true
  pretrained_checkpoint_path: null
  pretrained_strict: false
  freeze_encoder: true
  use_checkpoint: true

loss:
  name: "weighted_mse"
  weight_k: 5.0

training:
  max_epochs: 50            # 减少epoch数
  precision: "16-mixed"
  accelerator: "gpu"
  devices: 1
  seed: 42
  optimizer:
    name: "adamw"
    lr: 1.0e-4
    weight_decay: 1.0e-5
  scheduler:
    name: "cosine"
    T_max: 50
    eta_min: 1.0e-6
  gradient_clip_val: 1.0
  checkpoint_dir: "./checkpoints/fast_experiment"
  early_stopping:
    enabled: true
    patience: 5             # 更激进的早停
    monitor: "val_loss"
    mode: "min"
    min_delta: 0.001

evaluation:
  threshold_method: "otsu"
  metrics:
    - dice
    - auc
    - recall
    - precision

data_collection:
  enabled: true
  output_dir: "./outputs/metrics/fast_experiment"
  log_every_n_steps: 50

hydra:
  run:
    dir: "./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
